[package]
name = "ajproxy"
version = "0.1.0"
edition = "2021"
description = "AJProxy — Professional HTTP Intercepting Proxy"

[dependencies]
eframe = { version = "0.27", default-features = true }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
home = "=0.5.9"
idna_adapter = "=1.2.0"
mime_guess2 = "=2.3.0"
rcgen = "0.12"
time = "0.3"
rfd = "0.14"
wry = "0.38"
tao = "0.26"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2.12", features = ["native-tls", "brotli"] }
url = "2.5"
lazy_static = "1.5"
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"
html-escape = "0.2"
similar = "2.4"
socket2 = "0.5"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
